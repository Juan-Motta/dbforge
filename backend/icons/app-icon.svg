<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- DBForge's app icon: the explorer's database mark on the accent colour.
       macOS layout: an 824 px rounded square centred on the 1024 px canvas,
       the margin left for the shadow the Dock expects. Source of every size:
       `pnpm tauri icon backend/icons/app-icon.svg -o backend/icons`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4884a"/>
      <stop offset="1" stop-color="#c4501a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <!-- The database: three stacked discs, drawn with the same strokes as the in-app mark. -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="512" cy="330" rx="210" ry="78"/>
    <path d="M302 330v364c0 43 94 78 210 78s210-35 210-78V330"/>
    <path d="M302 512c0 43 94 78 210 78s210-35 210-78"/>
  </g>
</svg>
