[package]
name = "dbforge"
version = "0.1.0"
description = "A lightweight database viewer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "dbforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
either = "1"
futures-util = { version = "0.3", default-features = false }
keyring = "4.2"
mongodb = "3"
redis = { version = "1.8.1", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
roxmltree = "0.21.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2.0"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1.29", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
