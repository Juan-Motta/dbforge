[package]
name = "dbforge"
version = "0.1.0"
description = "A lightweight database viewer"
edition = "2024"
rust-version = "1.90"

# The executable's name is what macOS shows in the Dock and the menu bar
# while developing (`tauri dev` runs it unbundled); `mainBinaryName` in
# tauri.conf.json keeps the bundled app's the same.
[[bin]]
name = "DBForge"
path = "src/main.rs"

[lib]
name = "dbforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
either = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hmac = "0.13"
keyring = "4.2"
mongodb = "3"
redis = { version = "1.8.1", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
# Cosmos DB's REST API. TLS through rustls with the process-wide provider (`install_crypto`).
# The MCP server agents connect to (Streamable HTTP, served by axum on localhost).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
roxmltree = "0.21.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2.0"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
uuid = { version = "1.29", features = ["v4"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
machine-uid = "0.6"
getrandom = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
