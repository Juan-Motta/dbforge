# Each pushed version tag (v1.2.3) builds a signed, notarized universal DMG
# (Apple silicon and Intel) and publishes it as a GitHub Release. The tag
# must match the version in backend/tauri.conf.json.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes read the commits since the previous release

      - name: Check the tag matches the app's version
        run: |
          VERSION="$(jq -r .version backend/tauri.conf.json)"
          if [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION in backend/tauri.conf.json" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the signing secrets
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # An unsigned or unnotarized DMG is refused by Gatekeeper, so never ship one.
          for name in P12_BASE64 P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "The secret for $name is missing" >&2; exit 1; }
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # The tests that need database containers are ignored by default and don't run here.
        run: |
          pnpm test
          cargo test --manifest-path backend/Cargo.toml --lib

      - name: Build, sign and notarize the DMG
        env:
          # Tauri imports the certificate into a keychain of its own, signs the
          # app with it, notarizes it and staples the ticket before making the DMG.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # The secret holds the .p8 file's text as is, like ColiUI's.
          (umask 077; printf '%s\n' "$NOTARY_KEY_P8" > "$APPLE_API_KEY_PATH")
          pnpm tauri build --target universal-apple-darwin --bundles dmg
          mkdir -p release
          cp backend/target/universal-apple-darwin/release/bundle/dmg/*.dmg "release/DBForge-$VERSION.dmg"

      - name: Check the app in the DMG is signed and notarized
        # Tauri removes the .app it bundled once the DMG is made, so the copy in the DMG is checked:
        # it is also the one people install.
        run: |
          MOUNT="$RUNNER_TEMP/dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "release/DBForge-$VERSION.dmg"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/DBForge.app"
          xcrun stapler validate "$MOUNT/DBForge.app"
          spctl --assess --type execute --verbose=2 "$MOUNT/DBForge.app"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "release/DBForge-$VERSION.dmg" \
            --title "DBForge $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Remove the notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
