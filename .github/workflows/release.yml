# Each pushed version tag (v1.2.3) builds a signed, notarized universal DMG
# (Apple silicon and Intel) with the installer window of scripts/make-dmg.sh,
# and publishes it as a GitHub Release. The tag
# must match the version in backend/tauri.conf.json.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes read the commits since the previous release

      - name: Check the tag matches the app's version
        run: |
          VERSION="$(jq -r .version backend/tauri.conf.json)"
          if [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION in backend/tauri.conf.json" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the signing secrets
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # An unsigned or unnotarized DMG is refused by Gatekeeper, and an unsigned update by the app's
          # updater, so never ship either.
          for name in P12_BASE64 P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID UPDATER_KEY; do
            [[ -n "${!name}" ]] || { echo "The secret for $name is missing" >&2; exit 1; }
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # The tests that need database containers are ignored by default and don't run here.
        run: |
          pnpm test
          cargo test --manifest-path backend/Cargo.toml --lib

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity in the certificate" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: universal-apple-darwin
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # The secret holds the .p8 file's text as is, like ColiUI's.
          (umask 077; printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY_PATH")
          # Tauri signs the app with the identity imported above; the script signs and notarizes the DMG,
          # then packs and signs the update the app's updater installs.
          scripts/make-dmg.sh

      - name: Check the DMG and its app are signed and notarized
        run: |
          DMG="release/DBForge-$VERSION.dmg"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          MOUNT="$RUNNER_TEMP/dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/DBForge.app"
          spctl --assess --type execute --verbose=2 "$MOUNT/DBForge.app"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          UPDATE="DBForge-$VERSION.app.tar.gz"
          # The app reads releases/latest/download/latest.json, so each release carries its own.
          scripts/make-update-manifest.sh "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$UPDATE" \
            "release/$UPDATE.sig" "$RUNNER_TEMP/notes.md" > release/latest.json
          gh release create "$GITHUB_REF_NAME" "release/DBForge-$VERSION.dmg" "release/$UPDATE" release/latest.json \
            --title "DBForge $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
